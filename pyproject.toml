[project]
name = "vela-etl"
version = "0.1.0"
description = "Ingestion/extraction pipeline for Vela (Receipt Intelligence Platform)"
authors = [
    { name = "Muiz Haruna", email = "hmuiyze@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.31",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.7",
    "pre-commit>=4.0",
    "datamodel-code-generator>=0.26",
    "poethepoet>=0.29",
    "pyright>=1.1",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "etl"

[tool.ruff]
extend-exclude = ["src/etl/types"]

[tool.pyright]
include = ["src", "tests", "mock_api"]
exclude = [
    "src/etl/types",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
]
typeCheckingMode = "strict"

[tool.poe.tasks]
"submodule:init" = "git submodule update --init --recursive"
"submodule:update" = [
    { cmd = "git -C vendor/vela-core fetch" },
    { cmd = "git -C vendor/vela-core checkout ${NEW_COMMIT}" },
    { cmd = "git add vendor/vela-core" },
]
"gen:types" = "datamodel-codegen --input vendor/vela-core/schemas --input-file-type jsonschema --output src/etl/types --output-model-type pydantic_v2.BaseModel --formatters black --use-annotated"
bootstrap = ["submodule:init", "gen:types"]
test = "pytest"
pretest = "bootstrap"
lint = "ruff check ."
format = "ruff format ."
"lint:types" = "pyright"
"mock-api" = "uvicorn mock_api.app:app --port 2222 --reload"
